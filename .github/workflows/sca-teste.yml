name: SCA teste politica

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'hom = job vermelho sem trava; prod = trava'
        required: true
        type: choice
        default: hom
        options:
          - hom
          - prod
  push:
    branches: [demo/sca-teste]

permissions:
  contents: read

jobs:
  sca:
    name: SCA
    runs-on: ubuntu-24.04
    environment: veracode-afrika
    continue-on-error: ${{ inputs.environment != 'prod' }}
    env:
      SRCCLR_API_TOKEN: ${{ secrets.VERACODE_SCA_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Baixar o CLI SCA
        run: |
          curl -sSL https://sca-downloads.veracode.com/ci.sh \
          | bash -s -- scan \
            --update-advisor \
            --allow-dirty \
            --unmatched \
            --uri-as-name \
            --recursive

  proximo:
    name: Proximo passo
    needs: sca
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Esteira seguiu
        run: echo "Esteira continuou apos o SCA"
