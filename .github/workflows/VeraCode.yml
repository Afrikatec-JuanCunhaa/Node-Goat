# Veracode Connect
# Secrets (repo):
#   VERACODE_API_ID
#   VERACODE_API_KEY
#   VERACODE_SCA_TOKEN
#   BASELINE_GITHUB_APP_ID
#   BASELINE_GITHUB_APP_PRIVATE_KEY
#   BASELINE_GITHUB_APP_INSTALLATION_ID
# Variavel (repo):
#   BASELINE_ORG  → org dona de Afrika-Veracode-Connect-Baseline
#
# App name: apenas o nome do repositorio, lowercase, espacos → "-"

name: Veracode Connect

on:
  push:
    branches: [main, master, dev, qa]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veracode-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Package scan file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package for Veracode (app.zip)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y zip unzip
          rm -f app.zip

          # JS/TS S4R: source na raiz do zip, sem node_modules e sem archives aninhados
          zip -rq app.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".circleci/*" \
            -x ".vscode/*" \
            -x ".travis.yml" \
            -x "node_modules/*" \
            -x "*/node_modules/*" \
            -x "test/*" \
            -x "*/test/*" \
            -x "artifacts/*" \
            -x "terraform/*" \
            -x "Jscrawbler/*" \
            -x "*.zip" \
            -x "*.tar" \
            -x "*.tar.gz" \
            -x "*.tgz" \
            -x "*.rar" \
            -x "app.zip"

          echo "::group::Conteudo do app.zip"
          unzip -l app.zip | head -n 80
          echo "::endgroup::"

          if unzip -Z1 app.zip | grep -E '\.(zip|tar|tgz|rar)$|tar\.gz$'; then
            echo "::error::Archive aninhado dentro de app.zip (Veracode nao aceita)."
            exit 1
          fi

      - name: Upload scan file
        uses: actions/upload-artifact@v4
        with:
          name: veracode-scan-file
          path: app.zip
          if-no-files-found: error
          retention-days: 5

  security:
    name: Veracode Connect
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download scan file
        uses: actions/download-artifact@v4
        with:
          name: veracode-scan-file
          path: veracode-artifact

      - name: App name (repo only, lowercase)
        id: app
        run: |
          set -euo pipefail
          REPO_NAME="${{ github.event.repository.name }}"
          APP_NAME="$(printf '%s' "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | tr ' _' '--' | tr -s '-' | sed 's/^-//;s/-$//')"
          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "App Veracode: ${APP_NAME}"

      - name: Repo Baseline + SCA + IaC + Pipeline Scan + Upload and Scan
        uses: Afrika-Tecnologia/Veracode-Connect@v1
        with:
          veracode_api_id: ${{ secrets.VERACODE_API_ID }}
          veracode_api_key: ${{ secrets.VERACODE_API_KEY }}
          veracode_appname: ${{ steps.app.outputs.app_name }}

          enable_auto_packager: "false"
          scan_file: veracode-artifact/app.zip

          baseline_mode: "repo"
          baseline_org: ${{ vars.BASELINE_ORG }}
          baseline_github_app_id: ${{ secrets.BASELINE_GITHUB_APP_ID }}
          baseline_github_app_private_key: ${{ secrets.BASELINE_GITHUB_APP_PRIVATE_KEY }}
          baseline_github_app_installation_id: ${{ secrets.BASELINE_GITHUB_APP_INSTALLATION_ID }}

          enable_pipelinescan: "true"
          enable_sca: "true"
          veracode_sca_token: ${{ secrets.VERACODE_SCA_TOKEN }}
          enable_iac: "true"
          enable_upload_scan: "true"

          policy_fail: "false"
          fail_build: "false"
          create_issues: "false"
