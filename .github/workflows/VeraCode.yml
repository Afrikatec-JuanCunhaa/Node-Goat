# Veracode lab — SAST (Upload and Scan) + SCA + IaC
#
# Environment: veracode-natura
#   VERACODE_API_ID
#   VERACODE_API_KEY
#   VERACODE_SCA_TOKEN
#
# Seletor de scans (altere aqui OU no workflow_dispatch):
#   true  = executa
#   false = pula (codigo permanece)
#
# Rotas SAST:
#   default (main/master) → Upload and Scan Policy
#   dev                   → Upload and Scan Sandbox (node-goat-dev)
#   qa                    → Upload and Scan Sandbox (node-goat-qa)
#
# App name: apenas o nome do repositorio, lowercase, espacos → "-"
# IaC: resultados em Scans & Analysis → Container and IaC Analysis

name: Veracode Upload and Scan

on:
  push:
    branches: [main, master, dev, qa]
  workflow_dispatch:
    inputs:
      run_sast:
        description: "Rodar Upload and Scan (SAST)"
        type: boolean
        default: false
      run_sca:
        description: "Rodar SCA"
        type: boolean
        default: false
      run_iac:
        description: "Rodar IaC (Container/IaC/Secrets)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: veracode-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Fallback quando o trigger e push (workflow_dispatch usa os inputs acima)
  RUN_SAST: "false"
  RUN_SCA: "false"
  RUN_IAC: "true"

jobs:
  meta:
    name: Scan metadata
    runs-on: ubuntu-latest
    outputs:
      app_name: ${{ steps.set.outputs.app_name }}
      scan_type: ${{ steps.set.outputs.scan_type }}
      sandbox_name: ${{ steps.set.outputs.sandbox_name }}
      version: ${{ steps.set.outputs.version }}
      branch: ${{ steps.set.outputs.branch }}
      run_sast: ${{ steps.set.outputs.run_sast }}
      run_sca: ${{ steps.set.outputs.run_sca }}
      run_iac: ${{ steps.set.outputs.run_iac }}
    steps:
      - name: Derive app name, scan type, sandbox and scan flags
        id: set
        run: |
          set -euo pipefail

          REPO_NAME="${{ github.event.repository.name }}"
          APP_NAME="$(printf '%s' "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | tr ' _' '--' | tr -s '-' | sed 's/^-//;s/-$//')"

          BRANCH="${GITHUB_REF_NAME}"
          SHORT_SHA="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          VERSION="${BRANCH}-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"

          case "${BRANCH}" in
            main|master)
              SCAN_TYPE="policy"
              SANDBOX_NAME=""
              ;;
            dev)
              SCAN_TYPE="sandbox"
              SANDBOX_NAME="${APP_NAME}-dev"
              ;;
            qa)
              SCAN_TYPE="sandbox"
              SANDBOX_NAME="${APP_NAME}-qa"
              ;;
            *)
              echo "::error::Branch '${BRANCH}' nao mapeada. Use main/master (policy), dev ou qa (sandbox)."
              exit 1
              ;;
          esac

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN_SAST_FLAG="${{ github.event.inputs.run_sast }}"
            RUN_SCA_FLAG="${{ github.event.inputs.run_sca }}"
            RUN_IAC_FLAG="${{ github.event.inputs.run_iac }}"
          else
            RUN_SAST_FLAG="${RUN_SAST}"
            RUN_SCA_FLAG="${RUN_SCA}"
            RUN_IAC_FLAG="${RUN_IAC}"
          fi

          {
            echo "app_name=${APP_NAME}"
            echo "scan_type=${SCAN_TYPE}"
            echo "sandbox_name=${SANDBOX_NAME}"
            echo "version=${VERSION}"
            echo "branch=${BRANCH}"
            echo "run_sast=${RUN_SAST_FLAG}"
            echo "run_sca=${RUN_SCA_FLAG}"
            echo "run_iac=${RUN_IAC_FLAG}"
          } >> "$GITHUB_OUTPUT"

          echo "## Veracode lab" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Campo | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| App | \`${APP_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${BRANCH}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SAST type | \`${SCAN_TYPE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Sandbox | \`${SANDBOX_NAME:-n/a (policy)}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| RUN_SAST | \`${RUN_SAST_FLAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| RUN_SCA | \`${RUN_SCA_FLAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| RUN_IAC | \`${RUN_IAC_FLAG}\` |" >> "$GITHUB_STEP_SUMMARY"

  sast:
    name: Upload and Scan (${{ needs.meta.outputs.scan_type }})
    if: needs.meta.outputs.run_sast == 'true'
    needs: meta
    runs-on: ubuntu-latest
    environment: veracode-natura
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package source for Veracode (app.zip)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y zip unzip
          rm -f app.zip

          # JS/TS S4R: source na raiz do zip, sem node_modules e sem archives aninhados
          zip -rq app.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".circleci/*" \
            -x ".vscode/*" \
            -x ".travis.yml" \
            -x "node_modules/*" \
            -x "*/node_modules/*" \
            -x "test/*" \
            -x "*/test/*" \
            -x "artifacts/*" \
            -x "terraform/*" \
            -x "Jscrawbler/*" \
            -x "*.zip" \
            -x "*.tar" \
            -x "*.tar.gz" \
            -x "*.tgz" \
            -x "*.rar" \
            -x "app.zip"

          echo "::group::Conteudo do app.zip"
          unzip -l app.zip | head -n 80
          echo "::endgroup::"

          if unzip -Z1 app.zip | grep -E '\.(zip|tar|tgz|rar)$|tar\.gz$'; then
            echo "::error::Archive aninhado dentro de app.zip (Veracode nao aceita)."
            exit 1
          fi

      - name: Veracode Upload and Scan Policy
        if: needs.meta.outputs.scan_type == 'policy'
        uses: veracode/veracode-uploadandscan-action@0.2.11
        with:
          appname: ${{ needs.meta.outputs.app_name }}
          createprofile: true
          filepath: app.zip
          version: ${{ needs.meta.outputs.version }}
          vid: ${{ secrets.VERACODE_API_ID }}
          vkey: ${{ secrets.VERACODE_API_KEY }}
          criticality: VeryHigh
          scantimeout: 90
          scanpollinginterval: 30
          deleteincompletescan: 2
          scanallnonfataltoplevelmodules: true
          includenewmodules: true

      - name: Veracode Upload and Scan Sandbox
        if: needs.meta.outputs.scan_type == 'sandbox'
        uses: veracode/veracode-uploadandscan-action@0.2.11
        with:
          appname: ${{ needs.meta.outputs.app_name }}
          createprofile: true
          filepath: app.zip
          version: ${{ needs.meta.outputs.version }}
          vid: ${{ secrets.VERACODE_API_ID }}
          vkey: ${{ secrets.VERACODE_API_KEY }}
          createsandbox: true
          sandboxname: ${{ needs.meta.outputs.sandbox_name }}
          criticality: VeryHigh
          scantimeout: 90
          scanpollinginterval: 30
          deleteincompletescan: 2
          scanallnonfataltoplevelmodules: true
          includenewmodules: true

  sca:
    name: SCA (${{ needs.meta.outputs.branch }})
    if: needs.meta.outputs.run_sca == 'true'
    needs: meta
    runs-on: ubuntu-latest
    environment: veracode-natura
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Veracode Agent SCA
        id: veracode-sca
        env:
          SRCCLR_API_TOKEN: ${{ secrets.VERACODE_SCA_TOKEN }}
        uses: veracode/veracode-sca@v2.1.17
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          create-issues: false
          update_advisor: true
          allow-dirty: true
          breakBuildOnPolicyFindings: false
          profile_name: ${{ needs.meta.outputs.app_name }}

      - name: SCA report URL
        if: always() && steps.veracode-sca.outputs.scan-url
        run: |
          echo "SCA report: ${{ steps.veracode-sca.outputs.scan-url }}"
          echo "### SCA" >> "$GITHUB_STEP_SUMMARY"
          echo "Report: ${{ steps.veracode-sca.outputs.scan-url }}" >> "$GITHUB_STEP_SUMMARY"

  iac:
    name: IaC (${{ needs.meta.outputs.branch }})
    if: needs.meta.outputs.run_iac == 'true'
    needs: meta
    runs-on: ubuntu-latest
    environment: veracode-natura
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare IaC asset named like Upload and Scan
        run: |
          set -euo pipefail
          APP_NAME="${{ needs.meta.outputs.app_name }}"
          rm -rf "${APP_NAME}"
          mkdir -p "${APP_NAME}"
          cp -a terraform/. "${APP_NAME}/"
          echo "Upload and Scan appname: ${APP_NAME}"
          echo "IaC source directory: ${APP_NAME}"
          ls -la "${APP_NAME}" | head

      - name: Veracode IaC / Secrets scan
        uses: veracode/container_iac_secrets_scanning@v1.0.8
        with:
          vid: ${{ secrets.VERACODE_API_ID }}
          vkey: ${{ secrets.VERACODE_API_KEY }}
          command: scan
          type: directory
          source: ${{ needs.meta.outputs.app_name }}
          format: table
          debug: true
          fail_build: false
          fail_build_on_error: true
          generate_sbom_output: false

      - name: IaC summary
        if: always()
        run: |
          echo "### IaC" >> "$GITHUB_STEP_SUMMARY"
          echo "Nome (igual ao Upload and Scan): \`${{ needs.meta.outputs.app_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Resultados: Veracode → Scans & Analysis → **Container and IaC Analysis** (não fica na ficha SAST)." >> "$GITHUB_STEP_SUMMARY"
          echo "Procure o asset \`${{ needs.meta.outputs.app_name }}\`." >> "$GITHUB_STEP_SUMMARY"
