# Veracode Upload and Scan (stability test)
# Secrets (environment: veracode-afrika):
#   VERACODE_API_ID
#   VERACODE_API_KEY
#
# App name: apenas o nome do repositorio, lowercase, espacos → "-"
# Jobs policy + sandbox rodam em paralelo apos o package.

name: Veracode Connect

on:
  push:
    branches:
      - main
      - master
      - dev
      - qa
      - feat/veracode-upload-and-scan-stability
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veracode-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Package scan file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package for Veracode (app.zip)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y zip unzip
          rm -f app.zip

          # JS/TS S4R: source na raiz do zip, sem node_modules e sem archives aninhados
          zip -rq app.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".circleci/*" \
            -x ".vscode/*" \
            -x ".travis.yml" \
            -x "node_modules/*" \
            -x "*/node_modules/*" \
            -x "test/*" \
            -x "*/test/*" \
            -x "artifacts/*" \
            -x "terraform/*" \
            -x "Jscrawbler/*" \
            -x "*.zip" \
            -x "*.tar" \
            -x "*.tar.gz" \
            -x "*.tgz" \
            -x "*.rar" \
            -x "app.zip"

          echo "::group::Conteudo do app.zip"
          unzip -l app.zip | head -n 80
          echo "::endgroup::"

          if unzip -Z1 app.zip | grep -E '\.(zip|tar|tgz|rar)$|tar\.gz$'; then
            echo "::error::Archive aninhado dentro de app.zip (Veracode nao aceita)."
            exit 1
          fi

      - name: Upload scan file
        uses: actions/upload-artifact@v4
        with:
          name: veracode-scan-file
          path: app.zip
          if-no-files-found: error
          retention-days: 5

  policy-scan:
    name: Policy Scan (no sandbox)
    needs: build
    runs-on: ubuntu-latest
    environment: veracode-afrika
    steps:
      - name: Download scan file
        uses: actions/download-artifact@v4
        with:
          name: veracode-scan-file
          path: veracode-artifact

      - name: App name (repo only, lowercase)
        id: app
        run: |
          set -euo pipefail
          REPO_NAME="${{ github.event.repository.name }}"
          APP_NAME="$(printf '%s' "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | tr ' _' '--' | tr -s '-' | sed 's/^-//;s/-$//')"
          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "App Veracode: ${APP_NAME}"

      - name: Veracode Upload and Scan (Policy)
        uses: veracode/veracode-uploadandscan-action@0.2.10
        with:
          appname: ${{ steps.app.outputs.app_name }}
          createprofile: false
          filepath: veracode-artifact/app.zip
          version: policy-${{ github.run_id }}-${{ github.run_attempt }}
          vid: ${{ secrets.VERACODE_API_ID }}
          vkey: ${{ secrets.VERACODE_API_KEY }}
          scantimeout: 90
          deleteincompletescan: 1

  sandbox-scan:
    name: Sandbox Scan
    needs: build
    runs-on: ubuntu-latest
    environment: veracode-afrika
    steps:
      - name: Download scan file
        uses: actions/download-artifact@v4
        with:
          name: veracode-scan-file
          path: veracode-artifact

      - name: App name (repo only, lowercase)
        id: app
        run: |
          set -euo pipefail
          REPO_NAME="${{ github.event.repository.name }}"
          APP_NAME="$(printf '%s' "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | tr ' _' '--' | tr -s '-' | sed 's/^-//;s/-$//')"
          SANDBOX_NAME="$(printf '%s' "${{ github.ref_name }}" | tr '/ _' '---' | tr -s '-' | sed 's/^-//;s/-$//')"
          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "sandbox_name=stability-${SANDBOX_NAME}" >> "$GITHUB_OUTPUT"
          echo "App Veracode: ${APP_NAME}"
          echo "Sandbox: stability-${SANDBOX_NAME}"

      - name: Veracode Upload and Scan (Sandbox)
        uses: veracode/veracode-uploadandscan-action@0.2.10
        with:
          appname: ${{ steps.app.outputs.app_name }}
          createprofile: false
          filepath: veracode-artifact/app.zip
          version: sandbox-${{ github.run_id }}-${{ github.run_attempt }}
          vid: ${{ secrets.VERACODE_API_ID }}
          vkey: ${{ secrets.VERACODE_API_KEY }}
          createsandbox: true
          sandboxname: ${{ steps.app.outputs.sandbox_name }}
          scantimeout: 90
          deleteincompletescan: 1
