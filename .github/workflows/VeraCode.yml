# Veracode Pipeline Scan via Veracode Connect (scan_file + Repo Baseline)
# Secrets necessários:
#   VERACODE_API_ID
#   VERACODE_API_KEY
#   BASELINE_GITHUB_APP_ID
#   BASELINE_GITHUB_APP_PRIVATE_KEY
#   BASELINE_GITHUB_APP_INSTALLATION_ID
# Variáveis (Repository/Org Variables):
#   BASELINE_ORG  → org dona do repo Afrika-Veracode-Connect-Baseline
#
# Pré-requisito: repo privado Afrika-Veracode-Connect-Baseline na org (BASELINE_ORG),
# com GitHub App instalado (Contents: Read and write).

name: Veracode Pipeline Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NodeGoat: Dockerfile usa node:12; README exige Node >= 8
      # JS/TS Veracode (S4R): upload de source — sem compilação; excluir node_modules
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "12"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package for Veracode (app.zip)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y zip unzip

          rm -f app.zip

          # Zip plano: arquivos na raiz do archive (não pasta wrapper).
          # Sem zip-dentro-de-zip; sem node_modules (Veracode não analisa).
          zip -rq app.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".circleci/*" \
            -x ".vscode/*" \
            -x ".travis.yml" \
            -x "node_modules/*" \
            -x "*/node_modules/*" \
            -x "test/*" \
            -x "*/test/*" \
            -x "artifacts/*" \
            -x "terraform/*" \
            -x "Jscrawbler/*" \
            -x "*.zip" \
            -x "*.tar" \
            -x "*.tar.gz" \
            -x "*.tgz" \
            -x "*.rar" \
            -x "app.zip"

          echo "::group::Conteúdo do app.zip (amostra)"
          unzip -l app.zip | head -n 60
          echo "::endgroup::"

          echo "::group::Validar ausência de zip aninhado"
          if unzip -Z1 app.zip | grep -E '\.(zip|tar|tgz|rar)$|tar\.gz$'; then
            echo "::error::Encontrado archive aninhado dentro de app.zip (Veracode não aceita)."
            exit 1
          fi
          echo "OK: nenhum archive aninhado."
          echo "::endgroup::"

      - name: Upload scan file
        uses: actions/upload-artifact@v4
        with:
          name: veracode-scan-file
          path: app.zip
          if-no-files-found: error
          retention-days: 5

  security:
    name: Veracode Connect (Pipeline Scan + Repo Baseline)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download scan file
        uses: actions/download-artifact@v4
        with:
          name: veracode-scan-file
          path: veracode-artifact

      - name: Veracode Connect
        uses: Afrika-Tecnologia/Veracode-Connect@v1
        with:
          # Credenciais Veracode
          veracode_api_id: ${{ secrets.VERACODE_API_ID }}
          veracode_api_key: ${{ secrets.VERACODE_API_KEY }}

          # Artefato do job de build (sem auto packager)
          enable_auto_packager: "false"
          scan_file: veracode-artifact/app.zip

          # Somente Pipeline Scan com Repo Baseline
          baseline_mode: "repo"
          baseline_org: ${{ vars.BASELINE_ORG }}
          baseline_github_app_id: ${{ secrets.BASELINE_GITHUB_APP_ID }}
          baseline_github_app_private_key: ${{ secrets.BASELINE_GITHUB_APP_PRIVATE_KEY }}
          baseline_github_app_installation_id: ${{ secrets.BASELINE_GITHUB_APP_INSTALLATION_ID }}

          # Desliga demais scanners (defaults já são false; explícito por clareza)
          enable_sca: "false"
          enable_iac: "false"
          enable_upload_scan: "false"

          policy_fail: "false"
          fail_build: "true"
          create_issues: "false"
          veracode_appname: ${{ github.repository }}
